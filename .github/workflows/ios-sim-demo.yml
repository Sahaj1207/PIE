name: iOS Simulator Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bash scripts/fetch-pdfium-ios.sh

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/PdfAndImageEditor.xcworkspace \
            -scheme PdfAndImageEditor \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and install PIE
        run: |
          DEVICE=$(xcrun simctl list devices available | \
            sed -n 's/.*(\(iPhone[^)]*\)).*/\1/p' | head -1)

          echo "Using simulator: $DEVICE"

          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl install booted \
            build/Build/Products/Release-iphonesimulator/PdfAndImageEditor.app

          if compgen -G "store-demo/*.jpg" > /dev/null; then
            for f in store-demo/*.jpg; do
              xcrun simctl addmedia booted "$f"
            done
          fi

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Record demo
        run: |
          xcrun simctl io booted recordVideo \
            --codec=h264 pie-demo.mp4 &
          REC=$!

          sleep 3

          maestro test .maestro/demo.yaml \
            --debug-output maestro-debug || true

          sleep 2
          kill -INT "$REC" || true
          wait "$REC" || true

      - uses: actions/upload-artifact@v4
        with:
          name: pie-ios-simulator-demo
          path: |
            pie-demo.mp4
            maestro-debug/
